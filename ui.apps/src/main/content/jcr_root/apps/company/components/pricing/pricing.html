<sly data-sly-use.model="com.company.core.core.models.PricingModel"/>
<sly data-sly-use.style="com.adobe.cq.wcm.style.ComponentStyleInfo"/>

<section data-sly-test="${!model.empty}" class="cmp-pricing ${style.cssClasses}" data-animate-on-scroll>
    <h2 data-sly-test="${model.sectionTitle}" class="cmp-pricing__title">${model.sectionTitle}</h2>
    <p data-sly-test="${model.subtitle}" class="cmp-pricing__sub">${model.subtitle}</p>

    <div class="cmp-pricing__grid">
        <div
                data-sly-repeat.plan="${model.plans}"
                class="cmp-pricing__card ${plan.featured ? 'cmp-pricing__card--featured' : ''}">

            <div class="cmp-pricing__head">
                <span data-sly-test="${plan.badge}" class="cmp-pricing__badge">${plan.badge}</span>
                <h3 data-sly-test="${plan.name}" class="cmp-pricing__name">${plan.name}</h3>
                <div class="cmp-pricing__price">${plan.price}<span data-sly-test="${plan.period}">${plan.period}</span></div>
            </div>

            <div class="cmp-pricing__body">
                <p data-sly-test="${plan.intro}" class="cmp-pricing__intro">${plan.intro}</p>
                <ul class="cmp-pricing__features">
                    <li data-sly-repeat.feature="${plan.features}">${feature}</li>
                </ul>
            </div>

            <a
                    data-sly-test="${plan.ctaLabel}"
                    class="cmp-pricing__cta"
                    href="${plan.ctaLink @ context='uri'}">${plan.ctaLabel}</a>
        </div>
    </div>
</section>

<sly
        data-sly-test="${model.empty}"
        data-sly-use.template="core/wcm/components/commons/v1/templates.html"
        data-sly-call="${template.placeholder @ isEmpty=true}"/>
