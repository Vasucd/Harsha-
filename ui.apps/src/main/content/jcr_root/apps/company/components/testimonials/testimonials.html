<sly data-sly-use.model="com.company.core.core.models.TestimonialsModel"/>
<sly data-sly-use.style="com.adobe.cq.wcm.style.ComponentStyleInfo"/>

<section data-sly-test="${!model.empty}" class="cmp-testimonials ${style.cssClasses}" data-animate-on-scroll>
    <h2 data-sly-test="${model.sectionTitle}" class="cmp-testimonials__title">${model.sectionTitle}</h2>
    <div class="cmp-testimonials__grid">
        <figure data-sly-list.item="${model.items}" class="cmp-testimonials__card">
            <div class="cmp-testimonials__stars" aria-label="${item.rating} out of 5 stars">${item.stars}</div>
            <blockquote data-sly-test="${item.quote}">${item.quote}</blockquote>
            <figcaption><strong>${item.name}</strong> <sly data-sly-test="${item.program}">· ${item.program}</sly></figcaption>
        </figure>
    </div>
</section>

<sly
        data-sly-test="${model.empty}"
        data-sly-use.template="core/wcm/components/commons/v1/templates.html"
        data-sly-call="${template.placeholder @ isEmpty=true}"/>
