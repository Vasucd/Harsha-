<sly data-sly-use.model="com.company.core.core.models.BlogListingModel"/>
<sly data-sly-use.style="com.adobe.cq.wcm.style.ComponentStyleInfo"/>

<section
        data-sly-test="${!model.empty}"
        class="cmp-blog-listing ${style.cssClasses}"
        data-dynamic="true"
        data-blog-root="${properties.blogRootPath || '/content/company/us/en/blog'}"
        data-limit="${properties.maxItems || '5'}">

    <header class="cmp-blog-listing__head">
        <h2 data-sly-test="${model.sectionTitle}" class="cmp-blog-listing__title">${model.sectionTitle}</h2>

        <form class="cmp-blog-search" role="search" onsubmit="return false;">
            <span class="cmp-blog-search__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input
                    type="search"
                    class="cmp-blog-search__input"
                    placeholder="Search articles…"
                    aria-label="Search articles"
                    autocomplete="off"/>
            <button type="button" class="cmp-blog-search__clear" aria-label="Clear search" hidden>&#215;</button>
        </form>
    </header>

    <p class="cmp-blog-listing__status" role="status" aria-live="polite" hidden></p>

    <ul class="cmp-blog-listing__items">
        <li data-sly-repeat.item="${model.blogItems}" class="cmp-blog-listing__item">
            <a href="${item.path @ context='uri'}" class="cmp-blog-listing__link">
                <sly data-sly-test="${item.formattedDate || item.author}">
                    <p class="cmp-blog-listing__eyebrow">
                        <span data-sly-test="${item.formattedDate}" class="cmp-blog-listing__date">${item.formattedDate}</span>
                        <sly data-sly-test="${item.formattedDate && item.author}"> · </sly>
                        <span data-sly-test="${item.author}" class="cmp-blog-listing__author">${item.author @ context='text'}</span>
                    </p>
                </sly>
                <h3 class="cmp-blog-listing__item-title">${item.title @ context='text'}</h3>
                <p data-sly-test="${item.description}" class="cmp-blog-listing__description">${item.description @ context='text'}</p>
                <span class="cmp-blog-listing__more" aria-hidden="true">
                    <span class="cmp-blog-listing__more-label">Read article</span>
                </span>
            </a>
        </li>
    </ul>
</section>

<sly
        data-sly-test="${model.empty}"
        data-sly-use.template="core/wcm/components/commons/v1/templates.html"
        data-sly-call="${template.placeholder @ isEmpty=true}"/>
