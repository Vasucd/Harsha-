<sly data-sly-use.model="com.company.core.core.models.ContactFormModel"/>
<section class="cmp-contact-form">
    <h2 data-sly-test="${model.title}">${model.title}</h2>
    <form class="cmp-contact-form__form" method="post" action="${model.actionPath}">
        <div>
            <label>Name</label>
            <input type="text" name="name" required/>
        </div>
        <div>
            <label>Email</label>
            <input type="email" name="email" required/>
        </div>
        <div>
            <label>Subject</label>
            <input type="text" name="subject"/>
        </div>
        <div>
            <label>Message</label>
            <textarea name="message" required></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
</section>
